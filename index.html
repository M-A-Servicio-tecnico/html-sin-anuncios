<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS TV - Player Limpio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
        }
        #loading {
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding-top: 40vh;
            background: #000;
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 99999;
        }
    </style>
</head>
<body>

    <div id="loading"><h2>Cargando señal limpia...</h2></div>

    <script>
        function getParameterByName(name) {
            name = name.replace(/[\[]/, "\\[").replace(/[\]]/, "\\]");
            var regex = new RegExp("[\\?&]" + name + "=([^&#]*)"),
                results = regex.exec(location.search);
            return results === null ? "" : decodeURIComponent(results[1].replace(/\+/g, " "));
        }

        var targetUrl = getParameterByName('url');

        if (targetUrl) {
            // Creamos un iframe interno o redirigimos inyectando CSS para recortar
            window.location.replace(targetUrl);
        } else {
            document.getElementById('loading').innerHTML = "<h2>No se encontró el canal</h2>";
        }
    </script>
</body>
</html>
